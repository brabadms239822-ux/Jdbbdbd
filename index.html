<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Troco</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }

    input {
      padding: 12px;
      margin: 10px;
      width: 220px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      outline: none;
      text-align: center;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      background: #ff4081;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #e91e63;
    }

    .resultado {
      margin-top: 30px;
      padding: 20px;
      background: rgba(0,0,0,0.4);
      border-radius: 15px;
      font-size: 20px;
      line-height: 1.6;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>💵 Calculadora de Troco</h1>

  <input type="number" id="valorCompra" placeholder="Valor da compra (R$)" step="0.01">
  <br>
  <input type="number" id="valorPago" placeholder="Valor pago (R$)" step="0.01">
  <br>
  <button onclick="calcularTroco()">Calcular</button>

  <div class="resultado" id="resultado"></div>

  <footer>
    ✨ Feito por João Pedro ✨
  </footer>

  <script>
    function calcularTroco() {
      let compra = parseFloat(document.getElementById('valorCompra').value);
      let pago = parseFloat(document.getElementById('valorPago').value);

      if (isNaN(compra) || isNaN(pago)) {
        document.getElementById('resultado').innerHTML = "⚠️ Preencha todos os campos!";
        return;
      }

      let troco = pago - compra;

      if (troco < 0) {
        document.getElementById('resultado').innerHTML = "⚠️ Valor pago insuficiente!";
        return;
      }

      let notas = [100, 50, 20, 10, 5, 2, 1];
      let qtdNotas = {};
      let resto = Math.floor(troco);

      for (let i = 0; i < notas.length; i++) {
        qtdNotas[notas[i]] = Math.floor(resto / notas[i]);
        resto = resto % notas[i];
      }

      let textoNotas = "";
      for (let i = 0; i < notas.length; i++) {
        if (qtdNotas[notas[i]] > 0) {
          textoNotas += `${qtdNotas[notas[i]]} nota(s) de R$${notas[i]}<br>`;
        }
      }

      let moedas = (troco % 1).toFixed(2);

      document.getElementById('resultado').innerHTML =
        `<b>Valor da compra:</b> R$ ${compra.toFixed(2)} <br>
         <b>Valor pago:</b> R$ ${pago.toFixed(2)} <br>
         <b>Troco total:</b> R$ ${troco.toFixed(2)} <br><br>
         ${textoNotas}
         ${moedas > 0 ? "💰 Moedas: R$" + moedas : ""}`;
    }
  </script>
</body>
</html>
